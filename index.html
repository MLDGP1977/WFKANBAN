<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de Estoque Kanban com Alexa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 1);
        }

        @media (max-width: 640px) {
            .btn-mobile {
                width: 100%;
                justify-content: center;
                padding: 12px;
            }
        }

        .checkbox-custom {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #cbd5e1;
            appearance: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: white;
        }

        .checkbox-custom:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }

        .checkbox-custom:checked::after {
            content: '✓';
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .shelf-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .bin {
            aspect-ratio: 1;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            transition: all 0.3s;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #cbd5e1;
            overflow: hidden;
            padding: 2px;
            text-align: center;
            line-height: 1.2;
        }

        .bin.active {
            background-color: #3b82f6;
            color: white;
            border-color: #1d4ed8;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.7);
            z-index: 10;
            transform: scale(1.05);
        }

        .bin .bin-pos {
            font-size: 8px;
            font-weight: 900;
            opacity: 0.9;
            margin-top: 2px;
            background: rgba(0, 0, 0, 0.1);
            padding: 1px 3px;
            border-radius: 3px;
        }

        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6;
        }

        .logo-container img {
            max-height: 50px;
            width: auto;
            object-fit: contain;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin-custom {
            animation: spin 1s linear infinite;
        }

        .voice-active {
            color: #ef4444 !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* CONFIGURAÇÃO EXCLUSIVA PARA IMPRESSÃO DE ETIQUETAS */
        @media print {
            body * {
                visibility: hidden;
            }

            #print-section,
            #print-section * {
                visibility: visible;
            }

            #print-section {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: block !important;
            }

            @page {
                size: 80mm 40mm;
                margin: 0;
            }

            .label-to-print {
                width: 80mm;
                height: 40mm;
                padding: 4mm;
                page-break-after: always;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                font-family: Arial, sans-serif;
                color: black;
                border: none;
            }
        }

        #print-section {
            display: none;
        }
    </style>
</head>

<body class="p-2 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Cabeçalho -->
        <header
            class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center gap-4">
                <div class="logo-container">
                    <img src="https://mldgp1977.github.io/WFKANBAN/Logo.png" alt="Logo"
                        onerror="this.src='https://placehold.co/150x50?text=LOGO'">
                </div>
                <div class="border-l border-slate-200 pl-4">
                    <h1 class="text-xl md:text-2xl font-bold text-slate-800 leading-tight">Controle de Estoque</h1>
                    <p class="text-blue-600 font-semibold text-xs md:text-sm">Painel Kanban com Integração Alexa</p>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="file" id="fileInput" accept=".csv, .xlsx, .xls" class="hidden">
                <button onclick="document.getElementById('fileInput').click()"
                    class="btn-mobile bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-semibold transition flex items-center gap-2 shadow-md active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    Importar Planilha
                </button>
                <button onclick="deleteDataPrompt()"
                    class="btn-mobile bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2.5 rounded-xl font-semibold transition flex items-center gap-2 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18" />
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                    </svg>
                    Limpar Tudo
                </button>
            </div>
        </header>

        <!-- Filtros, Status e Conexão de IoT -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mb-6">
            <div class="glass-card p-4 md:p-6 rounded-2xl shadow-sm lg:col-span-2">
                <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wider">Ordem de
                    Serviço</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <select id="osSelect"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-4 pr-24 py-3 text-lg font-bold text-slate-700 focus:ring-4 focus:ring-blue-100 focus:outline-none transition appearance-none cursor-pointer">
                            <option value="">Conectando à nuvem...</option>
                        </select>
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-1">
                            <button id="voiceBtn" onclick="startVoiceRecognition()"
                                class="p-2 text-slate-400 hover:text-blue-600 transition-colors" title="Ditar OS">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                                    <line x1="12" y1="19" x2="12" y2="22" />
                                </svg>
                            </button>
                            <button id="clearOSBtn" onclick="clearOSSelection()"
                                class="p-2 text-slate-400 hover:text-red-500 transition-colors hidden"
                                title="Limpar Seleção">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button id="refreshBtn" onclick="refreshData()"
                        class="bg-slate-800 text-white px-8 py-3 rounded-xl font-bold transition hover:bg-black active:scale-95 flex items-center justify-center gap-2 min-w-[140px]">
                        <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6" />
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                        </svg>
                        Atualizar
                    </button>
                </div>
            </div>

            <!-- Painel de Status da API Google Sheets -->
            <div class="glass-card p-4 rounded-2xl shadow-sm flex flex-col justify-center items-center text-center">
                <span class="text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">Planilha Nuvem</span>
                <div id="apiStatusContainer" class="flex items-center gap-2 text-slate-400 font-bold">
                    <div id="apiIndicator" class="w-3 h-3 bg-slate-300 rounded-full"></div>
                    <span id="apiText" class="text-xs uppercase">Iniciando</span>
                </div>
            </div>

            <!-- Painel de Status da Conectividade Alexa (HTTP Polling com dweet.io - JSONP compatível com Canvas) -->
            <div class="glass-card p-4 rounded-2xl shadow-sm flex flex-col justify-between items-center text-center">
                <div class="w-full">
                    <span class="text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">Canal de Voz
                        Alexa</span>
                    <div id="alexaStatusContainer"
                        class="flex items-center justify-center gap-2 text-slate-400 font-bold">
                        <div id="alexaIndicator" class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                        <span id="alexaText" class="text-xs uppercase">Dweet JSONP Ativo</span>
                    </div>
                    <div class="text-[9px] text-slate-400 mt-0.5 font-semibold" id="alexaKeyInfo">Aguardando comando...
                    </div>
                </div>
                <!-- Simulador de voz integrado para testes fáceis na nuvem -->
                <div class="mt-2 pt-2 border-t border-slate-100 w-full">
                    <div class="flex gap-1">
                        <input type="text" id="simOSInput" placeholder="Nº OS"
                            class="w-1/2 text-xs px-2 py-1 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-400 font-bold text-center">
                        <button onclick="triggerSimulatedAlexa()"
                            class="w-1/2 bg-blue-500 hover:bg-blue-600 text-white text-[10px] py-1 px-1 rounded-lg font-bold transition">Simular
                            Voz</button>
                    </div>
                    <p class="text-[8px] text-slate-400 mt-1">Gera um sinal de teste real na nuvem dweet!</p>
                </div>
            </div>
        </div>

        <!-- Alerta de Notificação Flutuante / Voz Recente -->
        <div id="voiceAlert"
            class="hidden mb-4 bg-blue-50 border border-blue-200 text-blue-800 rounded-xl p-4 flex items-center gap-3 transition-all duration-300">
            <span class="flex h-3 w-3 relative">
                <span
                    class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span>
            </span>
            <span class="text-sm font-semibold" id="voiceAlertMsg">Alexa disparou o comando da OS...</span>
        </div>

        <!-- Navegação de Abas -->
        <div class="flex items-center border-b border-slate-200 mb-6 px-2">
            <div class="flex gap-8">
                <button onclick="switchTab('cards')" id="tab-cards"
                    class="pb-3 text-sm font-bold uppercase tracking-widest tab-active transition-all">Cards
                    Kanban</button>
                <button onclick="switchTab('map')" id="tab-map"
                    class="pb-3 text-sm font-bold uppercase tracking-widest text-slate-400 transition-all">Mapa de
                    Prateleiras</button>
            </div>
            <div class="ml-auto pb-2">
                <button onclick="printLabels()"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition shadow-md active:scale-95">Imprimir
                    Etiquetas</button>
            </div>
        </div>

        <!-- Conteúdos -->
        <div id="view-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
            <div class="col-span-full py-20 text-center text-slate-400 font-bold">Aguardando seleção de OS...</div>
        </div>

        <div id="view-map" class="hidden pb-20">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="shelvesContainer"></div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modalOverlay"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl scale-100 transition-all">
            <h2 id="modalTitle" class="text-2xl font-bold text-slate-800 mb-2">Ação</h2>
            <p id="modalContent" class="mb-8 text-slate-500 font-medium leading-relaxed"></p>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="closeModal()"
                    class="px-4 py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold active:scale-95 transition">Voltar</button>
                <button id="modalConfirmBtn"
                    class="px-4 py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-100 active:scale-95 transition">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Seção de Impressão (Invisível na tela) -->
    <div id="print-section"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzWcjZ8QJEXMa89aW4hdSXlqpYjb19GT1VDxQCbaEP5iS7V1svrWbf7n2dw7OpeiXXmYg/exec";

        // Nome exclusivo de canal do dweet
        const DWEET_THING_NAME = "kanban-estoque-alexa-99211";
        const params = new URLSearchParams(window.location.search);
        const osURL = params.get("os");

        let rawData = [];
        let currentOS = "";
        let lastPolledOS = "0";
        let pollingInterval;

        window.onload = async () => {
            await fetchInitialData();
            setupFileListeners();
            generateEmptyMap();
            initAlexaDweetPolling();
            const params =
                new URLSearchParams(
                    window.location.search
                );
            const osURL =
                params.get("os");
            if (osURL) {
                console.log(
                    "OS recebida da URL:",
                    osURL
                );
                setTimeout(() => {
                    handleIncomingAlexaOS(
                        osURL
                    );
                }, 1000);
            }
        };

        // ENVIAR DWEET USANDO SCRIPT TAG (JSONP) - IGNORA CORS E ERRO DE FETCH COMPLETAMENTE
        function sendDweetJSONP(os) {
            return new Promise((resolve, reject) => {
                const callbackName = 'dweet_send_callback_' + Math.round(Math.random() * 1000000);

                // Cria handler global temporário para a resposta
                window[callbackName] = function (data) {
                    delete window[callbackName];
                    const scriptEl = document.getElementById('jsonp_dweet_send');
                    if (scriptEl) scriptEl.remove();
                    resolve(data);
                };

                // Limpa script de envio anterior se houver
                const existing = document.getElementById('jsonp_dweet_send');
                if (existing) existing.remove();

                const script = document.createElement('script');
                script.id = 'jsonp_dweet_send';
                // dweet.io suporta passagem de dados na query string e resposta via callback JSONP
                script.src = `https://dweet.io/dweet/for/${DWEET_THING_NAME}?os=${os}&callback=${callbackName}`;
                script.onerror = (err) => {
                    delete window[callbackName];
                    script.remove();
                    reject(err);
                };
                document.body.appendChild(script);
            });
        }

        // LER DWEET USANDO SCRIPT TAG (JSONP) - MONITORAMENTO TOTALMENTE COMPATÍVEL
        function pollDweetJSONP() {
            const callbackName = 'dweet_get_callback_' + Math.round(Math.random() * 1000000);

            window[callbackName] = function (json) {
                delete window[callbackName];
                const scriptEl = document.getElementById('jsonp_dweet_get');
                if (scriptEl) scriptEl.remove();

                if (json.this === "succeeded" && json.with && json.with.length > 0) {
                    const dweetData = json.with[0].content;
                    const receivedOS = String(dweetData.os || dweetData.value || "").trim().replace(/\D/g, '');

                    if (receivedOS && receivedOS !== "0" && receivedOS !== lastPolledOS) {
                        lastPolledOS = receivedOS;
                        console.log("Nova OS recebida por canal de voz:", receivedOS);
                        handleIncomingAlexaOS(receivedOS);
                    }
                }
            };

            const existing = document.getElementById('jsonp_dweet_get');
            if (existing) existing.remove();

            const script = document.createElement('script');
            script.id = 'jsonp_dweet_get';
            script.src = `https://dweet.io/get/latest/dweet/for/${DWEET_THING_NAME}?callback=${callbackName}&t=${Date.now()}`;
            script.onerror = () => {
                delete window[callbackName];
                script.remove();
            };
            document.body.appendChild(script);
        }

        // INICIALIZA MONITORAMENTO DE VOZ DA ALEXA (HTTP POLLING VIA JSONP)
        function initAlexaDweetPolling() {
            const indicator = document.getElementById('alexaIndicator');
            const text = document.getElementById('alexaText');
            const keyInfo = document.getElementById('alexaKeyInfo');

            keyInfo.textContent = `Canal: ${DWEET_THING_NAME}`;

            indicator.className = "w-3 h-3 bg-emerald-500 rounded-full animate-pulse";
            text.textContent = "DWEET ATIVO";

            if (pollingInterval) clearInterval(pollingInterval);

            // Verifica novas mensagens a cada 3 segundos via Script Tags (JSONP)
            pollingInterval = setInterval(() => {
                pollDweetJSONP();
            }, 3000);
        }

        // SIMULADOR DE COMANDOS DE VOZ (Posta no dweet usando o pipeline JSONP sem usar fetch)
        async function triggerSimulatedAlexa() {
            const input = document.getElementById('simOSInput');
            const os = input.value.trim().replace(/\D/g, '');
            if (!os) {
                openModal("Simulação", "Por favor, digite uma OS válida para simular.", () => { });
                return;
            }
            const btn = document.querySelector("button[onclick='triggerSimulatedAlexa()']");
            try {
                btn.textContent = "Enviando...";
                btn.disabled = true;

                // Envia o dweet simulado usando o bypass JSONP
                await sendDweetJSONP(os);

                btn.textContent = "Enviado!";
                input.value = "";
                setTimeout(() => {
                    btn.textContent = "Simular Voz";
                    btn.disabled = false;
                }, 1500);
            } catch (e) {
                console.error("Erro ao simular dweet via JSONP:", e);
                openModal("Erro", "Falha de conexão com o pipeline JSONP. Tente novamente.", () => { });
                btn.textContent = "Simular Voz";
                btn.disabled = false;
            }
        }

        // TRATAMENTO DA OS VINDA DA ALEXA
        function handleIncomingAlexaOS(osNumber) {
            const select = document.getElementById('osSelect');
            if (!select) return;

            // Mostra o banner azul de comando recebido
            const alertBox = document.getElementById('voiceAlert');
            const alertMsg = document.getElementById('voiceAlertMsg');
            alertMsg.textContent = `Alexa disparou comando de voz! Selecionando OS ${osNumber}...`;
            alertBox.classList.remove('hidden');

            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 6000);

            let found = false;
            for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].value === osNumber) {
                    select.selectedIndex = i;
                    handleOSSelection(osNumber);
                    found = true;
                    break;
                }
            }

            if (!found) {
                console.log(`OS ${osNumber} não encontrada no dropdown. Atualizando dados da planilha...`);
                fetchInitialData().then(() => {
                    for (let i = 0; i < select.options.length; i++) {
                        if (select.options[i].value === osNumber) {
                            select.selectedIndex = i;
                            handleOSSelection(osNumber);
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        alertMsg.textContent = `A OS ${osNumber} dita pela Alexa não foi localizada na sua base de dados atual.`;
                    }
                });
            }
        }

        // RECONHECIMENTO DE VOZ DIRETO PELO MICROFONE DO COMPUTADOR
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                openModal("Não Suportado", "Este navegador não suporta o recurso de microfone local.", () => { });
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            const voiceBtn = document.getElementById('voiceBtn');
            voiceBtn.classList.add('voice-active');
            setApiStatus('loading', 'OUVINDO...');
            recognition.start();
            recognition.onresult = (event) => {
                let osNumber = event.results[0][0].transcript.replace(/\D/g, '');
                if (osNumber) {
                    const select = document.getElementById('osSelect');
                    let found = false;
                    for (let i = 0; i < select.options.length; i++) {
                        if (select.options[i].value === osNumber) {
                            select.selectedIndex = i;
                            handleOSSelection(osNumber);
                            found = true;
                            break;
                        }
                    }
                    if (!found) setApiStatus('error', 'OS NÃO ENCONTRADA');
                }
            };
            recognition.onspeechend = () => { recognition.stop(); voiceBtn.classList.remove('voice-active'); };
        }

        function switchTab(view) {
            document.getElementById('view-cards').classList.toggle('hidden', view !== 'cards');
            document.getElementById('view-map').classList.toggle('hidden', view !== 'map');
            document.getElementById('tab-cards').className = view === 'cards' ? 'pb-3 text-sm font-bold uppercase tracking-widest tab-active' : 'pb-3 text-sm font-bold uppercase tracking-widest text-slate-400';
            document.getElementById('tab-map').className = view === 'map' ? 'pb-3 text-sm font-bold uppercase tracking-widest tab-active' : 'pb-3 text-sm font-bold uppercase tracking-widest text-slate-400';
        }

        function setApiStatus(status, label = "") {
            const indicator = document.getElementById('apiIndicator');
            const text = document.getElementById('apiText');
            indicator.className = "w-3 h-3 rounded-full " + (status === 'loading' ? 'bg-blue-500 animate-pulse' : status === 'success' ? 'bg-green-500' : 'bg-red-500');
            text.textContent = label || (status === 'loading' ? 'CARREGANDO' : status === 'success' ? 'ONLINE' : 'OFFLINE');
        }

        async function fetchInitialData() {
            setApiStatus('loading');
            try {
                const response = await fetch(`${API_URL}?action=getImportData&t=${Date.now()}`);
                const data = await response.json();
                rawData = data.map(item => ({
                    ...item,
                    os: String(item.os).trim(),
                    ecod: String(item.ecod).trim(),
                    local: String(item.local || "").toUpperCase().trim()
                }));
                populateOSSelect(rawData);
                setApiStatus('success');
            } catch (e) { setApiStatus('error', 'ERRO CONEXÃO'); }
        }

        function populateOSSelect(data) {
            const select = document.getElementById('osSelect');
            const uniqueOS = [...new Set(data.map(item => item.os))].filter(os => os && os !== "undefined");
            select.innerHTML = '<option value="">Selecione uma O.S.</option>';
            uniqueOS.sort((a, b) => Number(a) - Number(b)).forEach(os => {
                const opt = document.createElement('option');
                opt.value = os; opt.textContent = `OS ${os}`;
                select.appendChild(opt);
            });
            select.onchange = (e) => handleOSSelection(e.target.value);

            if (currentOS) {
                select.value = currentOS;
            }
        }

        async function handleOSSelection(os) {
            currentOS = os;
            const board = document.getElementById('view-cards');
            document.getElementById('clearOSBtn').classList.toggle('hidden', !os);
            if (!os) {
                board.innerHTML = '<div class="col-span-full py-20 text-center text-slate-400 font-bold">Aguardando seleção de OS...</div>';
                resetMap();
                return;
            }
            const filtered = rawData.filter(item => item.os === os);
            renderKanban(filtered);
            updateMap(filtered);
            await sendPost({ action: 'syncApp', data: filtered });
        }

        function clearOSSelection() {
            document.getElementById('osSelect').value = "";
            handleOSSelection("");
        }

        function renderKanban(items) {
            const board = document.getElementById('view-cards');
            board.innerHTML = items.length ? '' : '<div class="col-span-full py-20 text-center text-slate-300 font-bold uppercase tracking-widest">Nenhum item pendente</div>';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-card p-6 rounded-[2rem] shadow-sm border-l-[12px] border-l-blue-500 hover:shadow-xl transition-all duration-300";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full tracking-wider">CÓD: ${item.ecod}</span>
                            <h3 class="font-bold text-slate-800 text-lg mt-3 leading-tight">${item.descricao}</h3>
                        </div>
                        <div class="ml-4 flex flex-col items-center gap-3">
                             <div class="flex flex-col items-center">
                                <label class="text-[9px] font-black text-slate-400 uppercase mb-1">Retirar</label>
                                <input type="checkbox" class="checkbox-custom" onclick="handleRetirado(this, '${item.os}', '${item.ecod}', '${item.descricao}')">
                            </div>
                            <div class="flex flex-col items-center">
                                <label class="text-[9px] font-black text-emerald-600 uppercase mb-1">Print</label>
                                <input type="checkbox" class="print-checkbox w-5 h-5 accent-emerald-600" data-os="${item.os}" data-ecod="${item.ecod}" checked>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 mb-6">
                        <div class="w-2.5 h-2.5 rounded-full ${item.local === 'NÃO LOCALIZADO' ? 'bg-red-500' : 'bg-emerald-500'}"></div>
                        <span class="text-xs font-bold uppercase ${item.local === 'NÃO LOCALIZADO' ? 'text-red-500' : 'text-slate-400'}">${item.local || 'SEM LOCAL'}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                            <div class="text-[10px] text-blue-400 font-black uppercase mb-1">Pedido OS</div>
                            <div class="font-black text-blue-700 text-2xl">${item.qtd}</div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                            <div class="text-[10px] text-slate-400 font-black uppercase mb-1">Estoque</div>
                            <div class="font-black text-slate-700 text-2xl">${item.totalEstoque}</div>
                        </div>
                    </div>`;
                board.appendChild(card);
            });
        }

        // MAPA
        function generateEmptyMap() {
            const container = document.getElementById('shelvesContainer');
            container.innerHTML = '';
            const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
            for (let p = 1; p <= 6; p++) {
                const shelf = document.createElement('div');
                shelf.className = "bg-white p-4 rounded-3xl border border-slate-100 shadow-sm";
                shelf.innerHTML = `<h4 class="text-center font-black text-slate-400 mb-4 uppercase tracking-widest text-[10px]">Prateleira P${p}</h4>`;
                const grid = document.createElement('div');
                grid.className = "shelf-grid";
                rows.forEach(r => {
                    for (let c = 1; c <= 5; c++) {
                        const bin = document.createElement('div');
                        bin.id = `P${p}-${r}${c}`; bin.className = "bin";
                        bin.innerHTML = `<span>${r}${c}</span>`;
                        grid.appendChild(bin);
                    }
                });
                shelf.appendChild(grid);
                container.appendChild(shelf);
            }
        }

        // RESET MAPA
        function resetMap() { document.querySelectorAll('.bin').forEach(b => { b.classList.remove('active'); b.innerHTML = `<span>${b.id.split('-')[1]}</span>`; }); }

        // ATUALIZA MAPA
        function updateMap(activeItems) {
            resetMap();
            activeItems.forEach(item => {
                let loc = item.local;
                if (!loc || loc === "NÃO LOCALIZADO") return;
                const normalizedId = loc.replace(/\s+/g, '-').replace(/([P]\d)([A-L])/, '$1-$2');
                const targetBin = document.getElementById(normalizedId);
                if (targetBin) {
                    targetBin.classList.add('active');
                    targetBin.innerHTML = `<span class="text-[9px] font-black truncate">${item.ecod}</span><span class="bin-pos">${loc}</span>`;
                }
            });
        }

        // AÇÕES KANBAN
        async function handleRetirado(checkbox, os, ecod, descricao) {
            if (!checkbox.checked) return;
            openModal("Baixa de Material", `Confirmar saída do item ${ecod}?`, async () => {
                const card = checkbox.closest('.glass-card');
                card.style.opacity = "0.3";
                setApiStatus('loading', 'PROCESSANDO...');
                const ok = await sendPost({ action: 'removeItem', os, ecod, descricao });
                if (ok) {
                    card.remove();
                    rawData = rawData.filter(i => !(i.os === os && i.ecod === ecod));
                    updateMap(rawData.filter(i => i.os === os));
                    setApiStatus('success', 'REMOVIDO');
                } else { checkbox.checked = false; card.style.opacity = "1"; setApiStatus('error', 'FALHA'); }
            }, () => { checkbox.checked = false; });
        }

        // IMPRESSÃO
        function printLabels() {
            const selected = document.querySelectorAll(".print-checkbox:checked");
            if (!selected.length) {
                openModal("Nenhum item selecionado", "Por favor, marque pelo menos uma caixa de seleção 'Print' para emitir etiquetas.", () => { });
                return;
            }
            const printSec = document.getElementById('print-section');
            printSec.innerHTML = '';
            selected.forEach(cb => {
                const ecod = cb.getAttribute('data-ecod');
                const os = cb.getAttribute('data-os');
                const item = rawData.find(i => i.ecod === ecod && i.os === os);
                const label = document.createElement('div');
                label.className = 'label-to-print';
                label.innerHTML = `
                    <div style="font-size: 10px; font-weight: bold;">OS: ${os}</div>
                    <div style="font-size: 24px; font-weight: 900; margin: 2px 0;">ECODE: ${ecod}</div>
                    <div style="font-size: 12px; font-weight: bold; border-bottom: 1px dashed black; padding-bottom: 2px;">LOTE: -</div>
                    <div style="font-size: 10px; margin-top: 5px;">${item ? item.descricao : ''}</div>`;
                printSec.appendChild(label);
            });
            window.print();
        }

        // ENVIO DO POST (PARA O GOOGLE SHEETS)
        async function sendPost(payload) {
            try { await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); return true; }
            catch (e) { return false; }
        }

        // CONTROLES MODAIS
        function openModal(t, c, cb, onCancel) {
            document.getElementById('modalTitle').textContent = t;
            document.getElementById('modalContent').textContent = c;
            document.getElementById('modalOverlay').classList.remove('hidden');
            document.getElementById('modalConfirmBtn').onclick = () => { cb(); closeModal(); };
            window.currentCancel = onCancel;
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
            if (window.currentCancel) window.currentCancel();
        }

        function deleteDataPrompt() {
            openModal("Limpar Tudo", "Apagar todos os registros?", async () => {
                setApiStatus('loading', 'LIMPANDO...');
                await sendPost({ action: 'deleteImport' });
                await sendPost({ action: 'clearApp' });
                location.reload();
            });
        }

        // LISTENERS DE IMPORTAÇÃO
        function refreshData() { location.reload(); }

        function setupFileListeners() {
            document.getElementById('fileInput').onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const workbook = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    const mapped = jsonData.map(row => [
                        row["Dt. Recebto"] || "", String(row["Nº OS"] || "").trim(), "", "",
                        row["Qtde Total LM"] || 0, String(row["Código LM"] || "").trim(), "", "",
                        row["Descrição LM"] || "", "", row["Qtde OS"] || 0
                    ]).filter(r => r[1]);
                    setApiStatus('loading', 'IMPORTANDO...');
                    if (await sendPost({ action: 'importCSV', payload: mapped })) location.reload();
                };
                reader.readAsArrayBuffer(file);
            };
        }
    </script>
</body>

</html>
